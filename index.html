<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Mensaje a mi PC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 12px; margin: 15px 0; resize: none; font-size: 14px; box-sizing: border-box; outline: none; }
        textarea:focus { border-color: #38bdf8; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        #estado { margin-top: 15px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Panel de Envío Remoto</h2>
        <p>Escribe tu mensaje para enviarlo directo a tu computadora:</p>
        
        <textarea id="mensajeInput" placeholder="Escribe tu mensaje aquí..."></textarea>
        <button onclick="enviarMensaje()">Enviar a la PC</button>
        <p id="estado"></p>
    </div>

    <script>
        async function enviarMensaje() {
            const texto = document.getElementById('mensajeInput').value;
            const estado = document.getElementById('estado');

            if (!texto.trim()) {
                estado.style.color = '#f87171';
                estado.innerText = 'El mensaje no puede estar vacío.';
                return;
            }

            estado.style.color = '#94a3b8';
            estado.innerText = 'Enviando mensaje...';

            try {
                // Nuevo enlace de Serveo integrado
                const urlTunel = 'https://2ecf4036168d5c92-149-107-244-209.serveousercontent.com';

                const respuesta = await fetch(urlTunel, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: texto, fecha: new Date().toLocaleString() })
                });

                if (respuesta.ok) {
                    estado.style.color = '#4ade80';
                    estado.innerText = '¡Mensaje recibido con éxito en la PC!';
                    document.getElementById('mensajeInput').value = '';
                } else {
                    throw new Error();
                }
            } catch (error) {
                estado.style.color = '#f87171';
                estado.innerText = 'Error: Revisa que el servidor en C y el túnel estén activos.';
            }
        }
    </script>
</body>
</html>
